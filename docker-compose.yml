services:
  etcd:
    container_name: xiangmu1-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - ./volumes/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  minio:
    container_name: xiangmu1-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - ./volumes/minio:/minio_data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus:
    container_name: xiangmu1-milvus
    image: milvusdb/milvus:v3.0.1
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    restart: unless-stopped

  app:
    container_name: xiangmu1-app
    build: .
    environment:
      APP_VECTOR_STORE: ${APP_VECTOR_STORE:-milvus}
      APP_MILVUS_URI: ${APP_MILVUS_URI:-http://milvus:19530}
      APP_MILVUS_TOKEN: ${APP_MILVUS_TOKEN:-root:Milvus}
      APP_STORAGE_PATH: /app/uploads
      APP_DATA_PATH: /app/data
      APP_EMBEDDING_PROVIDER: ${APP_EMBEDDING_PROVIDER:-local}
      APP_CHAT_PROVIDER: ${APP_CHAT_PROVIDER:-local}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gpt-4.1-mini}
      AI_EMBEDDING_DIMENSION: ${AI_EMBEDDING_DIMENSION:-384}
    ports:
      - "8080:8080"
    volumes:
      - ./uploads:/app/uploads
      - ./data:/app/data
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped
